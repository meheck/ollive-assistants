[project]
name = "ollive-assistants"
version = "0.1.0"
description = "OSS vs frontier personal assistants with tools, memory, and evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "anthropic>=0.106.0",
    "chromadb>=1.5.9",
    "ddgs>=9.14.4",
    "google-genai>=2.8.0",
    "gradio>=6.16.0",
    "mem0ai>=2.0.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "transformers>=5.10.2",
]

# Not a distributable package -- it's an app project. Code lives in src/ and is
# put on the path by the entry scripts (chat.py / eval / deploy apps), which
# keeps local runs dependency-light and avoids editable-install quirks.
[tool.uv]
package = false
