[project]
name = "ollive-assistants"
version = "0.1.0"
description = "OSS vs frontier personal assistants with tools, memory, and evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "anthropic>=0.106.0",
    "chromadb>=1.5.9",
    "ddgs>=9.14.4",
    "google-genai>=2.8.0",
    "gradio>=6.16.0",
    "mem0ai>=2.0.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "transformers>=5.10.2",
]

# Optional: live tracing UI (Arize Phoenix). Kept OUT of core deps so `uv sync`
# stays light and the Spaces don't carry it -- tracing is a no-op without an
# endpoint. Install with:  uv sync --extra obs
[project.optional-dependencies]
obs = [
    "arize-phoenix>=17.2",
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.42",
]

# Not a distributable package -- it's an app project. Code lives in src/ and is
# put on the path by the entry scripts (chat.py / eval / deploy apps), which
# keeps local runs dependency-light and avoids editable-install quirks.
[tool.uv]
package = false

# Lint with:  uvx ruff@0.14.0 check .   (pinned; no install needed, keeps uv sync light)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP).
# E501 (line length) is left to judgement -- many scenario prompts are long data
# strings that don't benefit from wrapping.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry scripts bootstrap sys.path BEFORE importing the package -> imports are
# intentionally not at the very top (E402).
"chat.py" = ["E402"]
"eval/run_evals.py" = ["E402"]
